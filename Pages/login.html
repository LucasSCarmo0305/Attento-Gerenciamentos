<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Attento</title>
    <link rel="stylesheet" href="../assets/css/Login.css">
    
</head>
<body>

    <main>
        <div class="login-card">
            <h1>Login</h1>
            <form id="loginForm">
                <div class="form-Usuario">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-Password">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
                </div>

                <button type="submit">Entrar</button>
            </form>

            <div class="register-link">
                <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Attento. Todos os direitos reservados.</p>
    </footer>

    <script src="/Assets/Javascrypt/login.js"></script>
    <script>

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            login();
        });
    </script>
</body>
</html>
